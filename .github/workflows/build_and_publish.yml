name: Build and Publish

on:
    workflow_call:
        inputs:
            mumble_version:
                required: true
                type: string
            docker_version:
                required: true
                type: string
            platforms:
                required: true
                type: string
            publish:
                required: true
                type: boolean
            update_latest:
                required: true
                type: boolean

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Login to DockerHub
              if: ${{ inputs.publish }}
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Login to GitHub Container registry
              if: ${{ inputs.publish }}
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Configure target tags (with latest)
              if: ${{ inputs.update_latest }}
              run: |
                MUMBLE_VER="${{ inputs.mumble_version }}"
                echo "PRE_TAGS=mumble-server:latest mumble-server:${MUMBLE_VER} mumble-server:${MUMBLE_VER%.*} mumble-server:${MUMBLE_VER}-${{ inputs.docker_version }}" >> $GITHUB_ENV

            - name: Configure target tags (without latest)
              if: ${{ ! inputs.update_latest }}
              run: |
                MUMBLE_VER="${{ inputs.mumble_version }}"
                echo "PRE_TAGS=mumble-server:${MUMBLE_VER} mumble-server:${MUMBLE_VER%.*} mumble-server:${MUMBLE_VER}-${{ inputs.docker_version }}" >> $GITHUB_ENV
                
            - name: Make tags for registries
              run: |
                TAG_ARRAY=()
                TAG_ARRAY_ACME=()
                for current in $PRE_TAGS; do
                  TAG_ARRAY+=("mumblevoip/${current}" "ghcr.io/mumble-voip/${current}")
                  TAG_ARRAY_ACME+=("mumblevoip/${current}-acme" "ghcr.io/mumble-voip/${current}-acme")
                done
                TAGS="$( IFS=","; echo "${TAG_ARRAY[*]}" )"
                TAGS_ACME="$( IFS=","; echo "${TAG_ARRAY_ACME[*]}" )"
                echo "TAGS=$TAGS" >> $GITHUB_ENV
                echo "TAGS_ACME=$TAGS_ACME" >> $GITHUB_ENV

            - name: Build and push (standard image)
              uses: docker/build-push-action@v7
              with:
                context: .
                target: mumble
                platforms: ${{ inputs.platforms }}
                push: ${{ inputs.publish }}
                build-args: |
                    MUMBLE_VERSION=${{ inputs.mumble_version }}
                tags: ${{ env.TAGS }}
              env:
                MUMBLE_VERSION: ${{ inputs.mumble_version }}

            - name: Build and push (ACME image)
              uses: docker/build-push-action@v7
              with:
                context: .
                target: mumble-acme
                platforms: ${{ inputs.platforms }}
                push: ${{ inputs.publish }}
                build-args: |
                    MUMBLE_VERSION=${{ inputs.mumble_version }}
                tags: ${{ env.TAGS_ACME }}
              env:
                MUMBLE_VERSION: ${{ inputs.mumble_version }}
